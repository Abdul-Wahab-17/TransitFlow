server.port=${PORT:8080}

# Database: set these through environment variables (see README / .env.example)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Super admin account (creates admins). Disabled unless both are set.
transitflow.superadmin.login-id=${SUPERADMIN_LOGIN_ID:}
transitflow.superadmin.pin=${SUPERADMIN_PIN:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
