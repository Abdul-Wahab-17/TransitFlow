<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Signup</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="top-nav">
    <a href="/" th:href="@{/}">TransitFlow</a>
    <a href="/login" th:href="@{/login}">Login</a>
</nav>
<main class="form-page">
    <section class="card form-card">
        <p class="eyebrow">Driver Signup</p>
        <h1>Create Driver Account</h1>
        <form th:action="@{/signup/driver}" method="post" class="stacked-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]+" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>
            <label for="pin">PIN</label>
            <input type="password" id="pin" name="pin" min="1000" max="9999" inputmode="numeric" required>
            <label for="areaId">Area</label>
            <select id="areaId" name="areaId" required onchange="updateDriverSignupOptions()">
                <option value="">Select area</option>
                <option th:each="area : ${areas}" th:value="${area.areaId}" th:text="${area.areaName}"></option>
            </select>
            <label for="vehicleId">Vehicle</label>
            <select id="vehicleId" name="vehicleId" required>
                <option value="">Select vehicle</option>
            </select>
            <label for="salaryId">Salary Plan</label>
            <select id="salaryId" name="salaryId" required>
                <option value="">Select salary</option>
            </select>
            <button type="submit">Create Account</button>
        </form>
    </section>
</main>
<script>
    function updateDriverSignupOptions() {
        const areaId = document.getElementById("areaId").value;
        const vehicleDropdown = document.getElementById("vehicleId");
        const salaryDropdown = document.getElementById("salaryId");
        resetSelect(vehicleDropdown, "Select vehicle");
        resetSelect(salaryDropdown, "Select salary");
        if (!areaId) {
            return;
        }
        fetchOptions("/getVehiclesByArea?areaId=" + areaId, vehicleDropdown, vehicle => vehicle.vehicleId, vehicle => vehicle.vehicleType + " - " + vehicle.number);
        fetchOptions("/getSalariesByArea?areaId=" + areaId, salaryDropdown, salary => salary.salaryId, salary => salary.amount);
    }
</script>
<script src="/signup.js"></script>
</body>
</html>
