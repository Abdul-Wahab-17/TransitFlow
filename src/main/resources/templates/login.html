<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="top-nav">
    <a href="/" th:href="@{/}">TransitFlow</a>
    <a href="/signup" th:href="@{/signup}">Create Account</a>
</nav>
<main class="auth-shell">
    <section class="login-form">
        <p class="eyebrow">Secure Access</p>
        <h1>Sign in</h1>
        <p class="muted">Use your login ID and PIN to open your dashboard.</p>
        <form action="/api/login/authenticate" method="post">
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message"></p>
            <div class="form-group">
                <label for="loginId">Login ID</label>
                <input type="text" id="loginId" name="loginId" inputmode="numeric" required>
            </div>
            <div class="form-group">
                <label for="password">PIN</label>
                <input type="password" id="password" name="password" inputmode="numeric" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </section>
</main>
</body>
</html>
